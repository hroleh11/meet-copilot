services:
  postgres:
    image: postgres:17-alpine
    container_name: cueline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cueline
      POSTGRES_PASSWORD: cueline
      POSTGRES_DB: cueline
    ports:
      - '5440:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cueline']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cueline-redis
    restart: unless-stopped
    ports:
      - '6390:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
