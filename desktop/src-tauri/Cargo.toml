[package]
name = "meet-copilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Meeting copilot that listens and drafts replies"

[lib]
name = "meet_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
meet-copilot-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.9.2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2.4.5"
tauri-plugin-opener = "2.5.5"
url = "2.5.7"
tokio = { workspace = true }
tauri-plugin-clipboard-manager = "2.3.3"
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
meet-copilot-platform-macos = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", features = ["linux-keyutils-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
