[workspace]
members = ["crates/core", "crates/platform-macos", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
meet-copilot-core = { path = "crates/core" }
meet-copilot-platform-macos = { path = "crates/platform-macos" }
async-trait = "0.1.89"
futures-core = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
cpal = "0.17.3"
rubato = "1.0.1"
tokio-util = "0.7.19"
audioadapter-buffers = "2.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
