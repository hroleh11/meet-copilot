[workspace]
members = ["crates/core", "crates/platform-macos", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
meet-copilot-core = { path = "crates/core" }
meet-copilot-platform-macos = { path = "crates/platform-macos" }
async-trait = "0.1.89"
base64 = "0.22.1"
futures-core = "0.3.31"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
cpal = "0.17.3"
rubato = "1.0.1"
tokio-util = "0.7.19"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
audioadapter-buffers = "2.0.0"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSResponder", "NSGraphics", "NSWorkspace"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGWindow", "CGImage", "CGDataProvider"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMBlockBuffer", "CMFormatDescription", "CMTime", "objc2-core-audio-types"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCScreenshotManager", "SCError", "block2", "objc2-core-media", "objc2-core-graphics"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
